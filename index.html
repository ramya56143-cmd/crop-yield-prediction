<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Crop Yield Prediction</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #56ab2f, #a8e063);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    width: 350px;
    text-align: center;
    box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
}

h1 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #56ab2f;
    color: white;
    font-size: 16px;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    background: #3e8e1f;
}

.result {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
    <h1>🌾 Crop Yield Predictor</h1>

    <form action="/predict" method="POST">
        <input type="number" step="any" name="rainfall" placeholder="Rainfall (mm)" required>
        <input type="number" step="any" name="temperature" placeholder="Temperature (°C)" required>
        <input type="number" step="any" name="fertilizer" placeholder="Fertilizer (kg)" required>
        <input type="number" step="any" name="pesticide" placeholder="Pesticide (kg)" required>

        <button type="submit">Predict Yield</button>
    </form>

    {% if prediction_text %}
    <div class="result">
        {{ prediction_text }}
    </div>
    {% endif %}
</div>

</body>
</html>
